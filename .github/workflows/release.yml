name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
            rpm_arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build deb package
        run: cargo deb --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Build rpm package
        run: cargo generate-rpm --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
          ## v0.3.11 更新汇总

          ### Bug 修复
          - **服务端到客户端测速提示「无效的登录状态」**：修复 daemon 直接用 proxy_token 调 chmlfrp API 导致的鉴权失败。现在与桌面客户端采用相同流程：先用 proxy_token 调后端 /auth/refresh 换取 accessToken（内存缓存 + 提前刷新 + 并发单飞），再用 accessToken 创建/删除测速隧道。

          ### 新功能
          - **远程重新授权（热更新令牌）**：proxy_token 过期前可在「设备管理 → 远程管理 → 重新授权」中重新授权，桌面端完成浏览器 OAuth 后自动把新令牌通过 RPC 发送给 daemon；daemon 校验并写入配置后自动用新令牌重连，全程无需重启服务、无需手动改配置。
            - 要求 daemon ≥ v0.3.11 且桌面客户端为配套新版本
            - 设备已离线（令牌彻底过期断连）时仍需手动更新服务器配置

          ### 升级说明
          - v0.3.10 及以上版本可通过「更新管理」远程自动更新到本版本。

          files: |
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: false
