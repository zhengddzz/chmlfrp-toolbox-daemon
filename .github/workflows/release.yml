name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: debian-11-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
          - platform: debian-11-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: rust-debian11-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-debian11-${{ matrix.arch }}-

      # 在 Debian 11 容器内构建：产物仅依赖 glibc >= 2.31（Debian 11 自带版本），
      # 同时 TLS 使用 rustls 静态链接进二进制，不依赖系统 OpenSSL，
      # 因此 Debian 11（OpenSSL 1.1.1）与 Debian 12+/Ubuntu 22.04+（OpenSSL 3.x）均可运行
      - name: Build and test in Debian 11 container
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          DEB_SUFFIX: ${{ matrix.deb_suffix }}
        run: |
          docker run --rm -v "$PWD:/build" -w /build \
            -e CARGO_HOME=/build/.cargo-home \
            -e TARGET -e ARCH -e DEB_SUFFIX \
            debian:11 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential pkg-config curl ca-certificates
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              . "$CARGO_HOME/env"

              cargo test --locked
              cargo build --locked --release --target "$TARGET"

              command -v cargo-deb >/dev/null 2>&1 || cargo install --locked cargo-deb
              command -v cargo-generate-rpm >/dev/null 2>&1 || cargo install --locked cargo-generate-rpm
              cargo deb --target "$TARGET" --output "chmlfrp-toolbox-daemon_${DEB_SUFFIX}.deb"
              cargo generate-rpm --target "$TARGET" --output "chmlfrp-toolbox-daemon_${ARCH}.rpm"

              # 容器以 root 写入的缓存目录放开权限，避免宿主 runner 用户无法读取缓存
              chmod -R ugo+rwX /build/target /build/.cargo-home 2>/dev/null || true
            '

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
            ## v0.3.17 更新汇总

            ### 兼容性
            - **Debian 11 支持**：二进制改在 Debian 11 环境中构建，最低 glibc 要求降至 2.31，新增兼容 Debian 11、Ubuntu 20.04 等较旧系统（Debian 12/13、Ubuntu 22.04+ 保持兼容）。
            - **摆脱 OpenSSL 依赖**：TLS 全部切换为 rustls 并静态编译进二进制，不再依赖系统 libssl，旧系统（OpenSSL 1.1.1）与新系统（OpenSSL 3.x）均可直接运行；证书校验跟随系统 ca-certificates 更新。

          files: |
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: false
