name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
            rpm_arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build deb package
        run: cargo deb --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Build rpm package
        run: cargo generate-rpm --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
            ## v0.3.15 更新汇总

            ### Bug 修复
            - **测速隧道连接失败**：修复服务端到客户端测速持续报"连接隧道失败：connection timed out / 连接被拒绝"的问题。frpc 配置此前缺少用户凭据，现在会自动获取并写入，frpc 可正常登录节点。
            - **隧道就绪判断**：不再固定等待 3 秒就开始测速，改为真实探测远端隧道端口，最长等待 30 秒，隧道没就绪不会误报测速失败。
            - **frpc 进程回收**：保留 frpc 进程句柄，测速结束或失败时立即回收进程、删除配置和临时隧道，不再遗留后台进程。
            - **错误提示增强**：frpc 启动失败时返回真实失败原因（如登录失败、隧道超时），日志中的用户令牌已自动打码。

            ### 安全改进
            - **frpc 配置加固**：配置改为标准格式并校验字段内容，Linux 下配置文件权限收紧为仅本用户可读写。

          files: |
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: false
