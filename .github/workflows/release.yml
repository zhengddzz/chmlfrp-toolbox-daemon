name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
            rpm_arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build deb package
        run: cargo deb --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Build rpm package
        run: cargo generate-rpm --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
            ## v0.3.12 更新汇总

            ### Bug 修复
            - **刷新 accessToken 报「builder error for url (wss://…)」**：修复 daemon 直接用 WebSocket 协议的后端地址（wss://）调 HTTP 接口 /auth/refresh 导致的请求构建失败。现在请求前自动将 wss:// 转为 https://、ws:// 转为 http://（与遥测上报逻辑一致）。
              - 此问题导致 v0.3.11 的「远程重新授权」与「服务端到客户端测速」的令牌刷新完全不可用，请从 v0.3.11 升级到本版本

            ### 升级说明
            - v0.3.10 及以上版本可通过「更新管理」远程自动更新到本版本。

          files: |
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: false
