name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
            rpm_arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build deb package
        run: cargo deb --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Build rpm package
        run: cargo generate-rpm --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/
          cp deploy/install.sh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
            ## 软件介绍

            ChmlFrp 社区工具箱 Daemon 是部署在 Linux 服务器上的远程管理守护进程，配合 ChmlFrp 社区工具箱桌面客户端使用。

            ### 核心功能

            - **端到端延迟测试**：支持 ICMP Ping 和 TCP Ping，测量服务器到 ChmlFrp 各节点的网络延迟
            - **端到端带宽测试**：通过 HTTP 下载/上传测速，评估服务器到节点的实际带宽
            - **远程配置管理**：通过桌面客户端远程查看和修改配置，包括账号增删改、后端地址修改
            - **远程服务控制**：远程启动、停止、重启服务，查看运行状态
            - **远程日志查看**：在线查看服务运行日志，无需 SSH 登录服务器
            - **在线检查更新**：一键检查并安装最新版本，支持自动更新开关
            - **多租户支持**：一台服务器可同时被多个账号绑定，数据按用户隔离

            ### 安装方式

            #### 一键安装（推荐）

            适用于 Ubuntu / Debian / CentOS / RHEL / Fedora 等，自动识别包管理器：

            ```bash
            curl -fsSL https://api.cct.zdzz.top/chmlfrp-toolbox-daemon/install.sh | sudo bash
            ```

            #### 手动安装 - deb 包（Ubuntu / Debian）

            ```bash
            # x64
            sudo dpkg -i chmlfrp-toolbox-daemon_amd64.deb
            sudo apt-get install -f

            # ARM64
            sudo dpkg -i chmlfrp-toolbox-daemon_arm64.deb
            sudo apt-get install -f
            ```

            #### 手动安装 - rpm 包（CentOS / RHEL / Fedora）

            ```bash
            # x64
            sudo dnf install -y chmlfrp-toolbox-daemon_x64.rpm
            # 或 CentOS 7
            sudo yum install -y chmlfrp-toolbox-daemon_x64.rpm

            # ARM64
            sudo dnf install -y chmlfrp-toolbox-daemon_arm64.rpm
            # 或 CentOS 7
            sudo yum install -y chmlfrp-toolbox-daemon_arm64.rpm
            ```

            ### 系统要求

            - Linux x64 或 ARM64 (aarch64)
            - Ubuntu 20.04+ / Debian 11+ / CentOS 8+ / RHEL 8+ / Fedora 35+ / Raspberry Pi OS (Bookworm) / Armbian
            - 不支持 32 位 ARM (armv7) 设备
          files: |
            release/*.deb
            release/*.rpm
            release/install.sh
          draft: false
          prerelease: false
