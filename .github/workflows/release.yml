name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: debian-11-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
          - platform: debian-11-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: rust-debian11-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-debian11-${{ matrix.arch }}-

      # 在 Debian 11 容器内构建：产物仅依赖 glibc >= 2.31（Debian 11 自带版本），
      # 同时 TLS 使用 rustls 静态链接进二进制，不依赖系统 OpenSSL，
      # 因此 Debian 11（OpenSSL 1.1.1）与 Debian 12+/Ubuntu 22.04+（OpenSSL 3.x）均可运行
      - name: Build and test in Debian 11 container
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          DEB_SUFFIX: ${{ matrix.deb_suffix }}
        run: |
          docker run --rm -v "$PWD:/build" -w /build \
            -e CARGO_HOME=/build/.cargo-home \
            -e TARGET -e ARCH -e DEB_SUFFIX \
            debian:11 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              # Debian 11 已停止常规支持，镜像内置的 deb.debian.org 安全源会 404；
              # 改用归档源并关闭 Valid-Until 校验，保留 glibc 2.31 构建环境
              printf "%s\n" "deb http://archive.debian.org/debian bullseye main" "deb http://archive.debian.org/debian-security bullseye-security main" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/debian.sources
              printf "%s\n" "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential pkg-config curl ca-certificates
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              . "$CARGO_HOME/env"

              cargo test --locked
              cargo build --locked --release --target "$TARGET"

              command -v cargo-deb >/dev/null 2>&1 || cargo install --locked cargo-deb
              command -v cargo-generate-rpm >/dev/null 2>&1 || cargo install --locked cargo-generate-rpm
              cargo deb --target "$TARGET" --output "chmlfrp-toolbox-daemon_${DEB_SUFFIX}.deb"
              cargo generate-rpm --target "$TARGET" --output "chmlfrp-toolbox-daemon_${ARCH}.rpm"

              # 容器以 root 写入的缓存目录放开权限，避免宿主 runner 用户无法读取缓存
              chmod -R ugo+rwX /build/target /build/.cargo-home 2>/dev/null || true
            '

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
            ## v0.3.18 更新汇总

            ### 新增功能
            - **状态查询可用**：`daemon status` 不再提示功能待实现，直接输出服务运行状态（JSON 格式），脚本和面板都能直接读取。

            ### 稳定性与安全
            - **DNS 容灾探测校验**：限制探测方法数量与类型、超时范围和隧道数量，并拒绝空 ID、空节点地址、0 端口和重复隧道；异常请求会直接返回错误，避免无效任务占用资源。

          files: |
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: false
