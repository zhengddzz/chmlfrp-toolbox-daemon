name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            deb_suffix: amd64
            rpm_arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_suffix: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build deb package
        run: cargo deb --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Build rpm package
        run: cargo generate-rpm --target ${{ matrix.target }} --output chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.deb_suffix }}.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: chmlfrp-toolbox-daemon_${{ matrix.arch }}.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/deb-x64/*.deb release/
          cp artifacts/deb-arm64/*.deb release/
          cp artifacts/rpm-x64/*.rpm release/
          cp artifacts/rpm-arm64/*.rpm release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChmlFrp 社区工具箱 Daemon ${{ github.ref_name }}
          body: |
            ## v0.3.16 更新汇总

            ### 适配与稳定性
            - **清理幂等**：重复下发清理请求不再报错——已有清理在进行时等待其完成，资源已释放时直接返回成功，与桌面客户端强制停止流程更好适配。
            - **更新互斥**：自动更新与手动更新同时触发时直接拒绝后者，避免重复下载与包管理器锁争抢。
            - **严格包匹配**：更新只安装与当前架构（x64/arm64）和包格式（deb/rpm）严格匹配的安装包，拒绝跨架构、跨发行版回退安装。

            ### 安全改进
            - **安全更新助手**：新增 root 管理的固定提权入口，sudoers 收紧为仅放行该助手与服务控制命令，修复"数据目录可写 + sudoers 放行 dpkg/rpm"的提权风险。助手校验包路径、文件名、SHA-256、包名与包架构，并复制到 root 暂存区防止校验后被替换（TOCTOU）。

            ### 安装脚本优化
            - **升级保留数据**：安装与升级过程保留 config.toml、device_id 与数据目录。
            - **双系发行版**：正确区分 apt/dnf/yum，不再对 dnf/yum 环境使用 deb 包降级安装。
            - **服务启动验证**：systemd 环境严格验证服务启动（运行中用 restart 确保新二进制生效），非 systemd 环境显式后台运行；卸载时停止正式单元、临时单元与后台进程，配置与数据目录删除前单独询问。

          files: |
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: false
