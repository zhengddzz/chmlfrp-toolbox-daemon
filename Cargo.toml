[package]
name = "chmlfrp-toolbox-daemon"
version = "0.3.4"
edition = "2021"
description = "ChmlFrp 社区工具箱 Daemon - 服务器端远程管理守护进程"
license = "MIT"
authors = ["zhengddzz"]

[[bin]]
name = "chmlfrp-toolbox-daemon"
path = "src/main.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HTTP 客户端（测速用）
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
futures-util = "0.3"
# WebSocket
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
# SQLite 数据库
rusqlite = { version = "0.31", features = ["bundled"] }
# CLI 参数解析
clap = { version = "4", features = ["derive"] }
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# UUID 生成
uuid = { version = "1", features = ["v4"] }
# 系统信息
sysinfo = "0.30"
# 正则表达式（ping 输出解析）
regex = "1"
# 原子操作
once_cell = "1"
# 错误处理
anyhow = "1"
# URL 编码
urlencoding = "2"
# libc（检测当前用户 uid）
libc = "0.2"
# SHA-256 校验（daemon 更新包校验）
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# ===== DEB 打包配置 =====
[package.metadata.deb]
maintainer = "zhengddzz <zhengddzz@github.com>"
copyright = "2026, zhengddzz"
license-file = ["LICENSE", "0"]
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/chmlfrp-toolbox-daemon", "usr/bin/", "755"],
    ["deploy/chmlfrp-toolbox-daemon.service", "etc/systemd/system/", "644"],
    ["deploy/config-template.toml", "etc/chmlfrp-toolbox-daemon/config.toml.example", "640"],
]
systemd-units = { unit-name = "chmlfrp-toolbox-daemon", enable = false, start = false }

# ===== RPM 打包配置（CentOS/RHEL/Fedora）=====
[package.metadata.generate-rpm]
summary = "ChmlFrp Community Toolbox Daemon"
license = "MIT"
url = "https://github.com/zhengddzz/chmlfrp-toolbox-daemon"
description = "ChmlFrp 社区工具箱 Daemon - 服务器端远程管理守护进程"
requires = { openssl-libs = "*", systemd = "*" }

assets = [
    { source = "target/release/chmlfrp-toolbox-daemon", dest = "/usr/bin/chmlfrp-toolbox-daemon", mode = "755" },
    { source = "deploy/chmlfrp-toolbox-daemon.service", dest = "/etc/systemd/system/chmlfrp-toolbox-daemon.service", mode = "644" },
    { source = "deploy/config-template.toml", dest = "/etc/chmlfrp-toolbox-daemon/config.toml.example", mode = "640" },
]

# 安装后自动设置开机自启（不立即启动，等用户配置后启动）
[package.metadata.generate-rpm.postinst]
script = """
systemctl daemon-reload 2>/dev/null || true
systemctl enable chmlfrp-toolbox-daemon 2>/dev/null || true
"""

# 卸载前停止服务
[package.metadata.generate-rpm.preuninst]
script = """
systemctl stop chmlfrp-toolbox-daemon 2>/dev/null || true
systemctl disable chmlfrp-toolbox-daemon 2>/dev/null || true
"""
